<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Games - Truth or Dare</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎉 Party Games 🎉</h1>
            <h2>Truth or Dare</h2>
        </header>

        <!-- Setup Screen -->
        <div id="setup-screen" class="screen active">
            <div class="setup-section">
                <h3>Game Setup</h3>
                
                <div class="form-group">
                    <label for="player-count">Number of Players:</label>
                    <input type="number" id="player-count" min="2" max="10" value="2">
                </div>

                <div id="player-names-container">
                    <div class="form-group">
                        <label>Player 1 Name:</label>
                        <input type="text" class="player-name" placeholder="Enter name" required>
                    </div>
                    <div class="form-group">
                        <label>Player 2 Name:</label>
                        <input type="text" class="player-name" placeholder="Enter name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="action-type">Action Type:</label>
                    <select id="action-type">
                        <option value="truth">Truth</option>
                        <option value="dare">Dare</option>
                        <option value="mixed">Mixed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="action-list-select">Action List:</label>
                    <select id="action-list-select">
                        <option value="default">Default List</option>
                    </select>
                    <button id="create-action-list-btn" class="btn-secondary">Create New List</button>
                </div>

                <div class="form-group">
                    <label for="punishment-list-select">Punishment List:</label>
                    <select id="punishment-list-select">
                        <option value="default">Default List</option>
                    </select>
                    <button id="create-punishment-list-btn" class="btn-secondary">Create New List</button>
                </div>

                <button id="start-game-btn" class="btn-primary">Start Game</button>
            </div>
        </div>

        <!-- Create List Modal -->
        <div id="list-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3 id="modal-title">Create Action List</h3>
                <div class="form-group">
                    <label for="list-name">List Name:</label>
                    <input type="text" id="list-name" placeholder="Enter list name">
                </div>
                <div class="form-group">
                    <label for="list-items">Items (one per line):</label>
                    <textarea id="list-items" rows="10" placeholder="Enter items, one per line"></textarea>
                </div>
                <button id="save-list-btn" class="btn-primary">Save List</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="game-header">
                <div class="round-info">
                    <span>Round: <span id="current-round">1</span>/10</span>
                    <span>Heat Level: <span id="heat-level">1</span>/5</span>
                </div>
                <div class="scores">
                    <h3>Scores</h3>
                    <div id="scores-container"></div>
                </div>
            </div>

            <div class="game-content">
                <div class="current-player-info">
                    <h2 id="current-player-name"></h2>
                    <p class="instruction-text">Your turn!</p>
                </div>

                <div class="action-display">
                    <div class="action-card">
                        <h3 id="action-text"></h3>
                        <p class="action-target" id="action-target"></p>
                    </div>
                </div>

                <div class="game-buttons">
                    <button id="completed-btn" class="btn-success">I Did It! (+10 points)</button>
                    <button id="skipped-btn" class="btn-danger">I Skipped It</button>
                </div>

                <div id="punishment-display" class="punishment-display hidden">
                    <h3>Punishment Time!</h3>
                    <p id="punishment-text"></p>
                    <button id="continue-btn" class="btn-primary">Continue</button>
                </div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen">
            <div class="game-over-content">
                <h2>🎊 Game Over! 🎊</h2>
                <div class="winner-announcement">
                    <h3 id="winner-name"></h3>
                    <p id="winner-score"></p>
                </div>
                <div class="final-scores">
                    <h3>Final Scores</h3>
                    <div id="final-scores-container"></div>
                </div>
                <button id="play-again-btn" class="btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
